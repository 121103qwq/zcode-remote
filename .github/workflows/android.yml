name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace

      - name: Build installable APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          verify --verbose --print-certs
          app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZLink-Remote-v0.2.0-debug.apk
          sha256sum ZLink-Remote-v0.2.0-debug.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZLink-Remote-debug-${{ github.sha }}
          path: |
            ZLink-Remote-v0.2.0-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
